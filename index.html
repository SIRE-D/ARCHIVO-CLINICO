<script>

  var st = !!(window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches));
  var ios = navigator.standalone === true;
  if (st || ios) h.classList.add("app-inst");
  if (ios) h.classList.add("app-ios");

<!-- 2) Íconos y manifest: se generan DESPUÉS del primer dibujo para no retrasar el arranque -->
<script>
(function () {
  var PWA = {
    nombre:       "ARCHIVO+",     // nombre bajo el ícono al instalar
    color1:       "#f0508a",    // degradado del ícono: esquina superior izquierda
    color2:       "#cf2bd6",    // degradado del ícono: esquina inferior derecha
    colorLatido:  "#ffffff",    // color del trazo de la carpeta
    fondoApp:     "#020617",    // color de la pantalla de arranque de la app
    fondoArranque:"#020617"     // fondo del arranque nativo de Android: NEGRO (el ícono redondo "any" tiene esquinas transparentes, así solo se ve el círculo)
  };

  // ---- Dibuja el ícono (carpeta con +) y lo devuelve como imagen PNG ----
  function icono(px, forma, glifo) {
    var c = document.createElement("canvas"); c.width = c.height = px;
    var x = c.getContext("2d"), k = px / 512;
    x.scale(k, k);
    var g = x.createLinearGradient(0, 0, 512, 512);
    g.addColorStop(0, PWA.color1); g.addColorStop(1, PWA.color2);
    x.fillStyle = g; x.beginPath();
    if (forma === "circulo") {            // 'any': cuadrado redondeado igual al ícono de referencia
      var r = 112;
      x.moveTo(r, 0); x.lineTo(512 - r, 0); x.quadraticCurveTo(512, 0, 512, r); x.lineTo(512, 512 - r);
      x.quadraticCurveTo(512, 512, 512 - r, 512); x.lineTo(r, 512); x.quadraticCurveTo(0, 512, 0, 512 - r);
      x.lineTo(0, r); x.quadraticCurveTo(0, 0, r, 0); x.closePath();
    } else { x.rect(0, 0, 512, 512); }     // 'mascara' y 'cuadrado': a sangre completa
    x.fill();
    if (forma === "mascara") glifo = glifo * .86;   // zona segura de Android
    x.translate(256, 256); x.scale(glifo * 11, glifo * 11); x.translate(-12, -12);
    x.strokeStyle = PWA.colorLatido; x.lineWidth = 2; x.lineCap = "round"; x.lineJoin = "round";
    x.stroke(new Path2D("M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"));
    x.stroke(new Path2D("M12 10v6"));
    x.stroke(new Path2D("M9 13h6"));
    return c.toDataURL("image/png");
  }

  function link(rel, href) { var l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); }

  // AYUDANTE PARA OTROS SISTEMAS: abre esta página con  #icono  al final de la dirección
  if (location.hash === "#icono") {
    window.addEventListener("load", function () {
      var t = document.createElement("textarea");
      t.value = '<link rel="apple-touch-icon" href="' + icono(180, "cuadrado", .92) + '">';
      t.style.cssText = "position:fixed;z-index:99;left:8px;right:8px;top:8px;height:40vh;background:#fff;color:#000;font:12px monospace";
      document.body.appendChild(t); t.select();
    });
  }

  function montar() {
    try {
      var base = location.origin + location.pathname;
      var carpeta = base.replace(/[^\/]*$/, "");
      // maskable = círculo sobre el mismo negro del arranque (sin cuadro visible); 'any' = círculo con esquinas transparentes
      var i192 = icono(192, "circulo", 1.05), i512 = icono(512, "circulo", 1.05), imask = icono(512, "mascara", 1.05);
      var manifest = {
        id: base, name: PWA.nombre, short_name: PWA.nombre, lang: "es",
        start_url: base, scope: carpeta, display: "standalone", orientation: "portrait",
        background_color: PWA.fondoArranque, theme_color: PWA.fondoApp,
        icons: [
          { src: i192, sizes: "192x192", type: "image/png", purpose: "any" },
          { src: i512, sizes: "512x512", type: "image/png", purpose: "any" },
          { src: imask, sizes: "512x512", type: "image/png", purpose: "maskable" }
        ]
      };
      link("manifest", URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" })));
    } catch (e) { /* si algo falla, la página web sigue funcionando igual */ }
  }
  function tarde() { requestAnimationFrame(function () { setTimeout(montar, 50); }); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tarde); else tarde();
})();
</script>

<style>
  :root{--cy:#22d3ee;--az:#2563eb;--vi:#8b5cf6;--fondo:#020617}
  html,body{margin:0;height:100%;background:var(--fondo);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  /* Alto del pie de marca: franja de contenido + zona segura inferior (iPhone). Android = 0 de zona segura. */
  :root{--pie-txt:30px;--pie-h:calc(var(--pie-txt) + env(safe-area-inset-bottom,0px))}
  /* Marco del sistema: ahora TERMINA donde empieza el pie, así el menú flotante de la app
     queda siempre por encima del pie, sin que nada lo tape ni lo roce. */
  #marco{position:fixed;top:0;left:0;right:0;bottom:var(--pie-h);background:var(--fondo)}
  /* iPhone instalado: el título baja un poco más debajo de la barra de estado / isla dinámica */
  html.app-ios #marco{top:calc(env(safe-area-inset-top,0px) + 18px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px)}
  #app{display:block;width:100%;height:100%;border:0;background:var(--fondo)}
  /* Pie de marca (iPhone y Android): ocupa la franja inferior completa, incluida la zona segura = sin línea negra */
  #pieSired{position:fixed;left:0;right:0;bottom:0;height:var(--pie-h);z-index:3;pointer-events:none;overflow:hidden;
    background:linear-gradient(180deg,#06102e 0%,#020617 100%);font-family:'Orbitron',system-ui,sans-serif}
  #pieSired canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #pieSired .cont{position:absolute;left:0;right:0;top:0;height:var(--pie-txt);display:flex;align-items:center;justify-content:center;gap:10px}
  #pieSired .cont::before{content:"";position:absolute;left:50%;top:50%;width:min(86%,300px);height:22px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center,rgba(2,6,23,.92) 0%,rgba(2,6,23,.82) 45%,rgba(2,6,23,0) 100%)}
  /* Línea divisoria app/pie: filamento tenue + haz de energía que la recorre + resplandor hacia arriba */
  #pieSired .lin{position:absolute;left:0;right:0;top:0;height:2px;z-index:2;
    background:linear-gradient(90deg,rgba(34,211,238,.15),rgba(99,102,241,.55),rgba(34,211,238,.15));overflow:hidden}
  #pieSired .lin::before{content:"";position:absolute;top:0;left:-35%;width:35%;height:100%;
    background:linear-gradient(90deg,transparent,#67e8f9 45%,#fff 55%,#a78bfa,transparent);
    filter:drop-shadow(0 0 4px #22d3ee);animation:haz 2.8s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes haz{to{left:100%}}
  #pieSired .res{position:absolute;left:0;right:0;top:0;height:14px;z-index:1;
    background:linear-gradient(180deg,rgba(34,211,238,.16),transparent);animation:resp 2.8s ease-in-out infinite}
  @keyframes resp{50%{opacity:.45}}

        }
      }
    }
    function bucle(ts) {
      if (!corriendo) return;
      var dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
      dibujar(dt); requestAnimationFrame(bucle);
    }
    function iniciar() { if (quieto || corriendo) return; corriendo = true; last = performance.now(); requestAnimationFrame(bucle); }
    document.addEventListener("visibilitychange", function () { if (document.hidden) corriendo = false; else iniciar(); });
    window.addEventListener("resize", medir);
    window.addEventListener("orientationchange", function () { setTimeout(medir, 250); });
    medir(); iniciar();
  })();
</script>
